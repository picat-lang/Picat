<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picat — WebAssembly</title>
<style>
  :root {
    --bg:      #0d1117;
    --pane:    #151b26;
    --pane2:   #10151f;
    --border:  #263042;
    --text:    #d8dee9;
    --dim:     #8b98ab;
    --accent:  #4fc3f7;
    --ok:      #7ee787;
    --err:     #ff7b72;
    --mono:    ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo,
               Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
  }

  /* ---- header ----------------------------------------------------- */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--pane);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .brand em {
    font-style: normal;
    color: var(--accent);
    font-weight: 500;
    font-size: 12px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 1px 8px;
    margin-left: 8px;
  }
  .spacer { flex: 1; }
  select, button {
    font: 13px var(--mono);
    color: var(--text);
    background: var(--pane2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
  }
  select { cursor: pointer; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.run {
    background: #1c5d38;
    border-color: #2ea05a;
    color: #eafff0;
    font-weight: 700;
    padding: 6px 18px;
  }
  button.run:hover:not(:disabled) { background: #23734a; }

  /* ---- file dropdown menu ------------------------------------------ */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px;
    background: var(--pane2);
    border-bottom: 1px solid var(--border);
  }
  .toolbar .pane-title.grow {
    flex: 1;
    padding: 6px 2px;
    border: 0;
    background: none;
  }
  .menu { position: relative; }
  .menu-items {
    display: none;
    position: absolute;
    left: 0;
    top: calc(100% + 6px);
    z-index: 10;
    min-width: 190px;
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    padding: 4px;
  }
  .menu.open .menu-items { display: block; }
  .menu-items button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: none;
    border-radius: 6px;
    padding: 7px 10px;
  }
  .menu-items button:hover {
    background: rgba(79,195,247,0.12);
    border-color: transparent;
  }
  .caret { color: var(--dim); font-size: 11px; }

  /* ---- link dialog ---------------------------------------------------- */
  #linkdlg {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4,7,12,0.66);
  }
  #linkdlg[hidden] { display: none; }
  #linkdlg-box {
    width: min(680px, calc(100vw - 40px));
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    padding: 14px 16px 16px;
  }
  #linkdlg-box .pane-title { border: 0; background: none; }
  #linkurl {
    width: 100%;
    font: 12.5px/1.4 var(--mono);
    color: var(--text);
    background: var(--pane2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    outline: none;
    margin: 4px 0 12px;
  }
  #linkurl:focus { border-color: var(--accent); }
  #linkdlg-btns { display: flex; justify-content: flex-end; gap: 8px; }

  /* ---- main split --------------------------------------------------- */
  main {
    flex: 1;
    display: flex;
    gap: 10px;
    padding: 10px;
    min-height: 0;
  }
  section {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .pane-title {
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--dim);
    background: var(--pane2);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #editor {
    flex: 1;
    resize: none;
    border: 0;
    outline: none;
    background: var(--pane);
    color: #e6edf7;
    font: 13.5px/1.55 var(--mono);
    padding: 12px 14px;
    tab-size: 4;
  }
  #terminal {
    flex: 1;
    margin: 0;
    overflow: auto;
    background: var(--pane2);
    color: #c9d4e5;
    font: 13.5px/1.55 var(--mono);
    padding: 12px 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #terminal .stamp { color: var(--dim); }

  /* ---- status bar ---------------------------------------------------- */
  footer {
    display: flex;
    gap: 16px;
    padding: 5px 16px;
    font-size: 12px;
    color: var(--dim);
    background: var(--pane);
    border-top: 1px solid var(--border);
  }
  footer .ok  { color: var(--ok); }
  footer .err { color: var(--err); }
</style>
</head>
<body>

<header>
  <div class="brand">Picat<em>WebAssembly</em></div>
  <div class="spacer"></div>
  <label style="color:var(--dim);font-size:13px">example&nbsp;
    <select id="examples"><option>Loading&hellip;</option></select>
  </label>
</header>

<main>
  <section>
    <div class="toolbar">
      <div class="menu" id="filemenu">
        <button type="button" id="filemenu-btn">File <span class="caret">&#9662;</span></button>
        <div class="menu-items">
          <button type="button" id="open-file">Open file&hellip;</button>
          <button type="button" id="save-file">Save as file&hellip;</button>
          <button type="button" id="share-link">Share as link&hellip;</button>
          <button type="button" id="load-link">Load from link&hellip;</button>
        </div>
      </div>
      <div class="pane-title grow" id="srcname">source</div>
      <button type="button" class="run" id="run" disabled>&#9654; Run</button>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
  </section>
  <section>
    <div class="pane-title">terminal</div>
    <pre id="terminal"></pre>
  </section>
</main>

<footer>
  <span id="state">loading runtime&hellip;</span>
  <span class="spacer"></span>
  <span id="lastrun"></span>
</footer>

<input type="file" id="file-input" accept=".pi,.txt,text/plain" hidden>

<div id="linkdlg" hidden>
  <div id="linkdlg-box">
    <div class="pane-title">load program from a link</div>
    <input type="text" id="linkurl" spellcheck="false"
           placeholder="the full share link (or just its program part)">
    <div id="linkdlg-btns">
      <button type="button" id="linkcancel">Cancel</button>
      <button type="button" class="run" id="linkok">Load</button>
    </div>
  </div>
</div>

<script src="picat.js"></script>
<script>
var M = null;
var booted = false;
var running = false;
/* Every Run takes a fresh interpreter (startRun): a live instance
   keeps its compiled modules, and $bp_first_call re-runs an existing
   module user_code instead of a newly loaded module-less program —
   so "hello, then the planner" would run hello twice.  A fresh
   instance re-creates the FS from the preload image, i.e. exactly a
   native `picat file` invocation. */
var $ = function (id) { return document.getElementById(id); };
var editor = $('editor'), terminal = $('terminal'),
    state = $('state'), lastrun = $('lastrun');

function appendOut(s) {
  terminal.textContent += s.replace(/\x1b\[[0-9;]*m/g, '') + '\n';
  terminal.scrollTop = terminal.scrollHeight;
}

function setState(txt, cls) {
  state.innerHTML = '';
  var span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = txt;
  state.appendChild(span);
}

function srcName() {
  var m = editor.value.match(/^\s*module\s+([A-Za-z_]\w*)\s*\./m);
  return (m ? m[1] : 'user_code') + '.pi';
}
function setSrcName() { $('srcname').textContent = 'source — ' + srcName(); }
editor.addEventListener('input', setSrcName);

/* Tab inserts four spaces instead of leaving the textarea. */
editor.addEventListener('keydown', function (e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    var s = editor.selectionStart, t = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + '    ' + editor.value.slice(t);
    editor.selectionStart = editor.selectionEnd = s + 4;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
});

/* ---- examples: populates the editor, never runs ------------------- */
function loadExample() {
  var sel = $('examples');
  if (!M || !sel.value || sel.value === 'Loading…') return;
  try {
    editor.value = M.FS.readFile('/examples/' + sel.value,
                                 {encoding: 'utf8'});
  } catch (e) {
    appendOut('cannot read example ' + sel.value + ': ' + e);
  }
  setSrcName();
}
$('examples').addEventListener('change', loadExample);

/* ---- run ------------------------------------------------------------ */
/*
  run()           -- one user Run: retarget the module line, defer to
                     the next frame, then startRun.
  startRun(code)  -- EVERY run takes a fresh interpreter (see the
                     vmNote block above) and runs code on it, as one
                     stage or as the two ASP stages.
  runAspStages  -- a program with embedded "asp ... end" blocks (aspic)
                    runs in two stages: stage 1 runs aspic_prep (a
                    pre-transpiler staged in the wasm CWD, "/"), which
                    writes /user_code_final.pi plus /aspic_runtime.pi;
                    stage 2 runs that result in another fresh
                    interpreter.  Ordinary programs run one stage.
  doRun(code)   -- write /user_code.pi and run it once, returning the
                    result.
  freshInterpreter -- build a fresh wasm module (a clean "restart
                    picat") and run a continuation on it.
  */
/* The aspic block marker is a bare "asp" (lowercase -- uppercase is a
   variable in Picat) as the FINAL word of a line (",asp" before the
   newline).  An asp(...) predicate call, which the PICASP library
   examples use, must not trigger the two-stage flow; aspic_prep itself
   reports clearly when the block is not closed. */
function hasAspBlock(code) {
  return /(^|[^A-Za-z0-9_])asp[ \t]*$/m.test(code);
}
/* Stage-1 driver: runs as /user_code.pi, calls the aspic pre-transpiler
   with the fixed web-FS paths.  The call must stay on one line
   (multi-line call arg lists do not parse in goal position). */
var ASPISTAGE1 =
  'module user_code.\n' +
  'import aspic_prep.\n' +
  'main=>\n' +
  '  aspic_prep("/user_code_raw.pi","/","/user_code_final.pi","/aspic_runtime_template.pi","sat").\n';

/* Start a fresh interpreter instance (a clean "restart picat");
   cont(M) runs on the fresh instance. */
function freshInterpreter(cont) {
  setState('starting a fresh interpreter…');
  M = null;            // drop the old module so its memory can be reclaimed
  booted = false;
  createModule().then(function () {
    cont(M);
  }).catch(function (e) {
    terminal.textContent = '';
    appendOut('\ncannot start the interpreter: ' + e);
    finishRun({ rc: -1, failed: true, ms: 0 });
  });
}

/* The two-stage ASP (aspic) run, on the current interpreter.
   Stage 2 MUST run in a fresh interpreter: $bp_first_call reuses the
   user_code module already compiled by stage 1 (the wrapper), so an
   in-place /user_code.pi overwrite would just re-execute the wrapper.
   A fresh interpreter also re-creates the FS from the preload image,
   so the stage-1 outputs are carried over explicitly.  Reports via
   finishRun (no return). */
function runAspStages(code) {
  var t0 = performance.now();
  M.FS.writeFile('/user_code_raw.pi', code);
  var r1 = doRun(ASPISTAGE1);
  if (r1.failed || r1.rc !== 1) {
    appendOut('\n[asp pre-translation failed]');
    finishRun(r1);
    return;
  }
  var fin = M.FS.readFile('/user_code_final.pi', {encoding: 'utf8'})
    .replace(/^\s*module\s+[A-Za-z_]\w*\s*\./m, 'module user_code.');
  var runtime = null;
  try { runtime = M.FS.readFile('/aspic_runtime.pi', {encoding: 'utf8'}); }
  catch (e) {}
  setState('compiled the ASP program — running…');
  freshInterpreter(function () {
    if (runtime) M.FS.writeFile('/aspic_runtime.pi', runtime);
    var r2 = doRun(fin);
    r2.ms = Math.round(performance.now() - t0);
    finishRun(r2);
  });
}

function doRun(code) {
  var t0 = performance.now();
  M.FS.writeFile('/user_code.pi', code);
  var rc = -1, failed = false;
  try {
    if (!booted) {
      M.ccall('browser_boot', 'null', ['string'], ['/lib2']);
      booted = true;
    }
    rc = M.ccall('browser_rerun', 'number');
  } catch (e) {
    /* picat calls exit(1) on uncaught errors; with NO_EXIT_RUNTIME the
       runtime survives.  The run is failed; the next Run takes a
       fresh interpreter anyway (startRun), so a dead instance never
       lingers. */
    failed = true;
  }
  return { rc: rc, failed: failed, ms: Math.round(performance.now() - t0) };
}

function finishRun(res) {
  appendOut('\n[finished in ' + res.ms + ' ms, status ' + res.rc + ']');
  lastrun.textContent = 'last run: ' + res.ms + ' ms';
  var ok = res.rc === 1 && !res.failed;
  setState(ok ? 'idle — last run ok' : 'idle — last run failed',
           ok ? 'ok' : 'err');
  running = false;
  $('run').disabled = false;
  $('run').innerHTML = '&#9654; Run';
}

function run() {
  if (!M || running) return;
  running = true;
  $('run').disabled = true;
  $('run').innerHTML = '&#9654; Running&hellip;';
  setState('running…');
  terminal.textContent = '';
  /* picat requires the module name to match the file name, and the file
     is always /user_code.pi: retarget an existing module line.  A
     module line is NOT added when absent -- programs may omit it, and
     for some libraries (e.g. the planner's plan/plan_unbounded, which
     look up final//action/ in the global module) a module line would
     break the program */
  var code = editor.value.replace(
    /^\s*module\s+[A-Za-z_]\w*\s*\./m, 'module user_code.');
  /* doRun runs synchronously in wasm and blocks the main thread for
     the whole program: the browser cannot repaint while it is
     running, so an immediately-started run would grey the button and
     say "running…" in the status bar only in the instant of its end.
     Deferring to after the next painted frame (double rAF) makes the
     running state actually visible for the duration of the run. */
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      setTimeout(function () { startRun(code); }, 0);
    });
  });
}

function startRun(code) {
  /* Every Run takes a fresh interpreter: a live instance keeps its
     compiled modules, and $bp_first_call re-runs an existing module
     user_code in place of a newly loaded module-less program (so
     "hello, then the planner" would run hello again).  A fresh
     instance also re-creates the emulated FS from the preload image
     and starts with a clean VM, so a Run behaves exactly like a
     native `picat file` call. */
  freshInterpreter(function () { startRunFresh(code); });
}

function startRunFresh(code) {
  try {
    if (hasAspBlock(code)) {
      runAspStages(code);   // reports itself
      return;
    }
    finishRun(doRun(code));
  } catch (e) {
    /* e.g. a failed FS write: never leave the button stuck disabled */
    appendOut('\ninternal error: ' + e);
    finishRun({ rc: -1, failed: true, ms: 0 });
  }
}
$('run').addEventListener('click', run);

/* ---- file menu ------------------------------------------------------- */
var menu = $('filemenu');
$('filemenu-btn').addEventListener('click', function (e) {
  e.stopPropagation();
  menu.classList.toggle('open');
});
document.addEventListener('click', function () {
  menu.classList.remove('open');
});
$('save-file').addEventListener('click', function () {
  var blob = new Blob([editor.value], {type: 'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = srcName();
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
});
$('open-file').addEventListener('click', function () {
  $('file-input').click();
});
$('file-input').addEventListener('change', function () {
  var f = this.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    editor.value = r.result;
    setSrcName();
  };
  r.readAsText(f);
  this.value = '';
});

/* ---- share link: the whole program in one URL parameter -------------- */
/* ?program= carries the editor text base64url-encoded (utf-8).  The link
   points at this page itself (origin + path of wherever this build is
   served), so visiting it restores the program into the editor. */
function b64encode(s) {
  var bytes = new TextEncoder().encode(s);
  var bin = '';
  for (var i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64decode(v) {
  v = v.replace(/-/g, '+').replace(/_/g, '/');
  while (v.length % 4) v += '=';
  var bin = atob(v);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
$('share-link').addEventListener('click', function () {
  var url = location.origin + location.pathname +
            '?program=' + b64encode(editor.value);
  var fallback = function () { window.prompt('Copy this share link:', url); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function () {
      setState('share link copied to the clipboard');
    }, fallback);
  } else {
    fallback();
  }
});
function applySharedLink() {
  var p = new URLSearchParams(location.search).get('program');
  if (!p) return;
  try {
    editor.value = b64decode(p);
    setSrcName();
    setState('program loaded from share link');
  } catch (e) {
    setState('the share link does not contain a valid program', 'err');
  }
}

/* ---- load-from-link dialog ---------------------------------------------- */
/* A share link can be too long for some servers to accept as a request;
   this path decodes one locally, so only an ordinary page load reaches
   the server.  The field takes the full link (its program parameter is
   extracted) or, for convenience, the bare encoded program text. */
var linkdlg = $('linkdlg');
function closeLinkDlg() { linkdlg.hidden = true; }
$('load-link').addEventListener('click', function () {
  $('linkurl').value = '';
  linkdlg.hidden = false;
  $('linkurl').select();
});
$('linkcancel').addEventListener('click', closeLinkDlg);
linkdlg.addEventListener('click', function (e) {
  if (e.target === linkdlg) closeLinkDlg();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !linkdlg.hidden) closeLinkDlg();
});
$('linkok').addEventListener('click', loadFromLinkText);
$('linkurl').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') loadFromLinkText();
});
function loadFromLinkText() {
  var v = $('linkurl').value.trim();
  if (!v) { closeLinkDlg(); return; }
  var p = v, isUrl = false;
  if (v.indexOf('://') >= 0 || v.charAt(0) === '/') {
    isUrl = true;
    var q = new URL(v, location.href).searchParams.get('program');
    if (!q) { setState('that link has no program parameter', 'err'); return; }
    p = q;
  }
  try {
    editor.value = b64decode(p);
    setSrcName();
    closeLinkDlg();
    setState('program loaded from link');
  } catch (e) {
    setState(isUrl ? 'the link does not contain a valid program'
                   : 'that text is not a valid encoded program', 'err');
  }
}

/* ---- module lifecycle -------------------------------------------------- */
/* Create an interpreter module.  This is the unit a "restart" re-creates:
   a fresh module is a fresh initialize_bprolog with a fresh emulated
   filesystem (all example data files are baked into the preload image). */
function createModule() {
  return PicatWasm({
    print:  function (s) { appendOut(s); },
    printErr: function (s) { appendOut(s); },
  }).then(function (mod) {
    M = mod;
    booted = false;
    return mod;
  });
}

function populateExamples() {
  var files = M.FS.readdir('/examples')
                 .filter(function (f) { return /\.pi$/.test(f); })
                 .sort();
  var sel = $('examples');
  sel.innerHTML = '';
  files.forEach(function (f) {
    var o = document.createElement('option');
    o.value = f;
    o.textContent = f;
    sel.appendChild(o);
  });
  if (files.length) {
    sel.value = files[0];
    loadExample();
  }
}

/* ---- boot -------------------------------------------------------------- */
createModule().then(function () {
  populateExamples();
  applySharedLink();         // a ?program= link overrides the default example
  $('run').disabled = false;
  setState('ready');
  setSrcName();
}).catch(function (e) {
  setState('failed to load the runtime: ' + e.message, 'err');
});

</script>
</body>
</html>
