<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picat — WebAssembly</title>
<style>
  :root {
    --bg:      #0d1117;
    --pane:    #151b26;
    --pane2:   #10151f;
    --border:  #263042;
    --text:    #d8dee9;
    --dim:     #8b98ab;
    --accent:  #4fc3f7;
    --ok:      #7ee787;
    --err:     #ff7b72;
    --mono:    ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo,
               Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
  }

  /* ---- header ----------------------------------------------------- */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--pane);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .brand em {
    font-style: normal;
    color: var(--accent);
    font-weight: 500;
    font-size: 12px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 1px 8px;
    margin-left: 8px;
  }
  .spacer { flex: 1; }
  select, button {
    font: 13px var(--mono);
    color: var(--text);
    background: var(--pane2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
  }
  select { cursor: pointer; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.run {
    background: #1c5d38;
    border-color: #2ea05a;
    color: #eafff0;
    font-weight: 700;
    padding: 6px 18px;
  }
  button.run:hover:not(:disabled) { background: #23734a; }

  /* ---- file dropdown menu ------------------------------------------ */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px;
    background: var(--pane2);
    border-bottom: 1px solid var(--border);
  }
  .toolbar .pane-title.grow {
    flex: 1;
    padding: 6px 2px;
    border: 0;
    background: none;
  }
  .menu { position: relative; }
  .menu-items {
    display: none;
    position: absolute;
    left: 0;
    top: calc(100% + 6px);
    z-index: 10;
    min-width: 190px;
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    padding: 4px;
  }
  .menu.open .menu-items { display: block; }
  .menu-items button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: none;
    border-radius: 6px;
    padding: 7px 10px;
  }
  .menu-items button:hover {
    background: rgba(79,195,247,0.12);
    border-color: transparent;
  }
  .caret { color: var(--dim); font-size: 11px; }

  /* ---- link dialog ---------------------------------------------------- */
  #linkdlg {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4,7,12,0.66);
  }
  #linkdlg[hidden] { display: none; }
  #linkdlg-box {
    width: min(680px, calc(100vw - 40px));
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    padding: 14px 16px 16px;
  }
  #linkdlg-box .pane-title { border: 0; background: none; }
  #linkurl {
    width: 100%;
    font: 12.5px/1.4 var(--mono);
    color: var(--text);
    background: var(--pane2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    outline: none;
    margin: 4px 0 12px;
  }
  #linkurl:focus { border-color: var(--accent); }
  #linkdlg-btns { display: flex; justify-content: flex-end; gap: 8px; }

  /* ---- main split --------------------------------------------------- */
  main {
    flex: 1;
    display: flex;
    gap: 10px;
    padding: 10px;
    min-height: 0;
  }
  section {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .pane-title {
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--dim);
    background: var(--pane2);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #termttl { display: flex; align-items: center; gap: 8px; }
  #buildid {
    margin-left: auto;
    font: 10.5px/1.7 var(--mono);
    font-weight: 400;
    letter-spacing: 0.4px;
    text-transform: none;
    color: var(--dim);
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 8px;
  }
  #editor {
    flex: 1;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: transparent;         /* the #hl overlay shows the colored text */
    caret-color: #e6edf7;
    font: 13.5px/1.55 var(--mono);
    padding: 12px 14px;
    tab-size: 4;
    position: relative;
    z-index: 1;
  }
  #editor::selection { background: rgba(86, 140, 245, 0.35); color: transparent; }
  /* the syntax-colored text, layered under the transparent-text
     textarea (the overlay recipe): same font metrics, padding and
     wrapping as the textarea, scrolled only via JS sync, never
     interactive itself */
  #hl {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 12px 14px;
    font: 13.5px/1.55 var(--mono);
    tab-size: 4;
    white-space: pre-wrap;
    word-break: break-word;
    color: #e6edf7;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  #hl .c { color: #8b949e; font-style: italic; }   /* comments */
  #hl .s { color: #7ee787; }                       /* strings, quoted atoms */
  #hl .n { color: #f2cc60; }                       /* numbers */
  #hl .v { color: #79c0ff; }                       /* variables */
  #hl .k { color: #ff7b72; }                       /* keywords */
  #hl .x { color: #d2a8ff; }                       /* constraint operators */
  #hl .a { color: #d2a8ff; }                       /* rule arrows, :-, $ */
  /* full-line row highlights for the lint-flagged lines: translucent
     strips painted UNDER the colored text, one per VISUAL row (a
     wrapped logical line gets one strip per row, measured from the
     #hl overlay's rendered rows) */
  #lintrows {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 12px 14px;
    font: 13.5px/1.55 var(--mono);
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  #lintrows .row {
    position: absolute;
    left: 0;
    right: 0;
    background: rgba(229, 83, 75, 0.16);
    border-left: 3px solid rgba(229, 83, 75, 0.75);
    border-radius: 2px;
  }
  /* the lint gutter: a thin strip over the textarea's right edge that
     flags the rows the *** lint: diagnostics point at (the textarea
     cannot be marked up in place, so the strip overlays it instead) */
  .editor-wrap { flex: 1; min-height: 0; position: relative; display: flex; background: var(--pane); }
  #lintgutter {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 20px;
    overflow: hidden;
    pointer-events: none;
    z-index: 2;   /* above the textarea (z-index: 1): the dots must
                     receive the mouse, the strip still passes clicks
                     through (pointer-events: none) */
  }
  #lintmarks { position: absolute; top: 0; left: 0; right: 0; will-change: transform; }
  #lintmarks .mark {
    position: absolute;
    right: 0;
    width: 14px;
    height: 14px;
    border: 3px solid transparent;   /* enlarges the mouse target to 20px */
    background: #ff9d2e;
    background-clip: padding-box;
    border-radius: 50%;
    box-shadow: 0 0 5px rgba(255, 157, 46, 0.75);
    cursor: pointer;
    pointer-events: auto;
  }
  /* the lint tooltip: the message of a flagged line, shown over the
     gutter dot on hover (immediately, styled -- the native title
     tooltip is delayed and unstyled) */
  #linttip {
    position: absolute;
    max-width: 70%;
    background: #141a26;
    color: #e6edf7;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    font: 12px/1.5 var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    z-index: 20;
    pointer-events: none;
  }
  #terminal {
    flex: 1;
    margin: 0;
    overflow: auto;
    background: var(--pane2);
    color: #c9d4e5;
    font: 13.5px/1.55 var(--mono);
    padding: 12px 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #terminal .stamp { color: var(--dim); }

  /* ---- status bar ---------------------------------------------------- */
  footer {
    display: flex;
    gap: 16px;
    padding: 5px 16px;
    font-size: 12px;
    color: var(--dim);
    background: var(--pane);
    border-top: 1px solid var(--border);
  }
  footer .ok  { color: var(--ok); }
  footer .err { color: var(--err); }
</style>
</head>
<body>

<header>
  <div class="brand">Picat<em>WebAssembly</em></div>
  <div class="spacer"></div>
  <label style="color:var(--dim);font-size:13px">example&nbsp;
    <select id="examples"><option>Loading&hellip;</option></select>
  </label>
</header>

<main>
  <section>
    <div class="toolbar">
      <div class="menu" id="filemenu">
        <button type="button" id="filemenu-btn">File <span class="caret">&#9662;</span></button>
        <div class="menu-items">
          <button type="button" id="open-file">Open file&hellip;</button>
          <button type="button" id="save-file">Save as file&hellip;</button>
          <button type="button" id="share-link">Share as link&hellip;</button>
          <button type="button" id="load-link">Load from link&hellip;</button>
        </div>
      </div>
      <div class="pane-title grow" id="srcname">source</div>
      <button type="button" class="run" id="run" disabled>&#9654; Run</button>
    </div>
    <div class="editor-wrap">
      <div id="lintrows"></div>
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="editor" spellcheck="false"></textarea>
      <div id="lintgutter" hidden><div id="lintmarks"></div></div>
      <div id="linttip" hidden></div>
    </div>
  </section>
  <section>
    <div class="pane-title" id="termttl"><span>terminal</span>
      <span id="buildid">__PICAT_BUILD_ID__</span>
    </div>
    <pre id="terminal"></pre>
  </section>
</main>

<footer>
  <span id="state">loading runtime&hellip;</span>
  <span class="spacer"></span>
  <span id="lastrun"></span>
</footer>

<input type="file" id="file-input" accept=".pi,.txt,text/plain" hidden>

<div id="linkdlg" hidden>
  <div id="linkdlg-box">
    <div class="pane-title">load program from a link</div>
    <input type="text" id="linkurl" spellcheck="false"
           placeholder="the full share link (or just its program part)">
    <div id="linkdlg-btns">
      <button type="button" id="linkcancel">Cancel</button>
      <button type="button" class="run" id="linkok">Load</button>
    </div>
  </div>
</div>

<script src="picat.js"></script>
<script>
var M = null;
var booted = false;
var running = false;
/* the two-stage ASP path (runAspStages): suppress the lint marker
   display for these runs -- their lint line numbers refer to the
   GENERATED stage files, not the editor's content */
var aspRun = false;
/* Every Run takes a fresh interpreter (startRun): a live instance
   keeps its compiled modules, and $bp_first_call re-runs an existing
   module user_code instead of a newly loaded module-less program —
   so "hello, then the planner" would run hello twice.  A fresh
   instance re-creates the FS from the preload image, i.e. exactly a
   native `picat file` invocation. */
var $ = function (id) { return document.getElementById(id); };
var editor = $('editor'), terminal = $('terminal'),
    state = $('state'), lastrun = $('lastrun');

/* Build stamp: webasm/Makefile bakes the commit id this dist/ was
   built from (a '+' marks a dirty tree) plus the base Picat version
   after a middle dot ("<sha>+ · 4.0b20") into the terminal title bar,
   so a deployed page shows which build and which base release it is.
   Remove the badge when the placeholder was never substituted (a page
   straight from the checkout, not a build).  NB: the test string below
   must NOT contain the full __PICAT_BUILD_ID__ token -- the makefile's
   sed substitutes all occurrences of it, and a match here would invert
   the guard. */
(function () {
  var b = $('buildid'), v = b ? b.textContent.trim() : '';
  if (!b || v.indexOf('__PICAT_') === 0) { if (b) b.remove(); return; }
  var parts = v.split(' · ');
  b.title = 'built from commit ' + parts[0];
  if (parts[1]) b.title += ', based on ' + parts[1];
})();

function appendOut(s) {
  terminal.textContent += s.replace(/\x1b\[[0-9;]*m/g, '') + '\n';
  terminal.scrollTop = terminal.scrollHeight;
}

function setState(txt, cls) {
  state.innerHTML = '';
  var span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = txt;
  state.appendChild(span);
}

function srcName() {
  var m = editor.value.match(/^\s*module\s+([A-Za-z_]\w*)\s*\./m);
  return (m ? m[1] : 'user_code') + '.pi';
}
function setSrcName() { $('srcname').textContent = 'source — ' + srcName(); }
editor.addEventListener('input', setSrcName);

/* Tab inserts four spaces instead of leaving the textarea. */
editor.addEventListener('keydown', function (e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    var s = editor.selectionStart, t = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + '    ' + editor.value.slice(t);
    editor.selectionStart = editor.selectionEnd = s + 4;
    renderHl();  /* programmatic .value assignment fires no input event */
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
});

/* ---- examples: populates the editor, never runs ------------------- */
function loadExample() {
  var sel = $('examples');
  if (!M || !sel.value || sel.value === 'Loading…') return;
  try {
    editor.value = M.FS.readFile('/examples/' + sel.value,
                                 {encoding: 'utf8'});
  } catch (e) {
    appendOut('cannot read example ' + sel.value + ': ' + e);
  }
  setSrcName();
  clearLint();  /* the content was replaced: drop the old lint artifacts */
  renderHl();   /* programmatic .value assignment fires no input event */
}
$('examples').addEventListener('change', loadExample);

/* ---- run ------------------------------------------------------------ */
/*
  run()           -- one user Run: retarget the module line, defer to
                     the next frame, then startRun.
  startRun(code)  -- EVERY run takes a fresh interpreter (see the
                     vmNote block above) and runs code on it, as one
                     stage or as the two ASP stages.
  runAspStages  -- a program with embedded "asp ... end" blocks (aspic)
                    runs in two stages: stage 1 runs aspic_prep (a
                    pre-transpiler staged in the wasm CWD, "/"), which
                    writes /user_code_final.pi plus /aspic_runtime.pi;
                    stage 2 runs that result in another fresh
                    interpreter.  Ordinary programs run one stage.
  doRun(code)   -- write /user_code.pi and run it once, returning the
                    result.
  freshInterpreter -- build a fresh wasm module (a clean "restart
                    picat") and run a continuation on it.
  */
/* The aspic block marker is a bare "asp" (lowercase -- uppercase is a
   variable in Picat) as the FINAL word of a line (",asp" before the
   newline; trailing blanks and CR tolerated, as in aspic_prep).
   An asp(...) predicate call, which the PICASP library examples
   use, must not trigger the two-stage flow; aspic_prep itself
   reports clearly when the block is not closed. */
function hasAspBlock(code) {
  return /(^|[^A-Za-z0-9_])asp[ \t\r]*$/m.test(code);
}
/* Stage-1 driver: runs as /user_code.pi, calls the aspic pre-transpiler
   with the fixed web-FS paths.  The call must stay on one line
   (multi-line call arg lists do not parse in goal position). */
var ASPISTAGE1 =
  'module user_code.\n' +
  'import aspic_prep.\n' +
  'main=>\n' +
  '  aspic_prep("/user_code_raw.pi","/","/user_code_final.pi","/aspic_runtime_template.pi","sat").\n';

/* Start a fresh interpreter instance (a clean "restart picat");
   cont(M) runs on the fresh instance. */
function freshInterpreter(cont) {
  setState('starting a fresh interpreter…');
  M = null;            // drop the old module so its memory can be reclaimed
  booted = false;
  createModule().then(function () {
    cont(M);
  }).catch(function (e) {
    terminal.textContent = '';
    appendOut('\ncannot start the interpreter: ' + e);
    finishRun({ rc: -1, failed: true, ms: 0 });
  });
}

/* The two-stage ASP (aspic) run, on the current interpreter.
   Stage 2 MUST run in a fresh interpreter: $bp_first_call reuses the
   user_code module already compiled by stage 1 (the wrapper), so an
   in-place /user_code.pi overwrite would just re-execute the wrapper.
   A fresh interpreter also re-creates the FS from the preload image,
   so the stage-1 outputs are carried over explicitly.  Reports via
   finishRun (no return). */
function runAspStages(code) {
  var t0 = performance.now();
  aspRun = true;
  M.FS.writeFile('/user_code_raw.pi', code);
  var r1 = doRun(ASPISTAGE1);
  if (r1.failed || r1.rc !== 1) {
    appendOut('\n[asp pre-translation failed]');
    finishRun(r1);
    return;
  }
  var fin = M.FS.readFile('/user_code_final.pi', {encoding: 'utf8'})
    .replace(/^\s*module\s+[A-Za-z_]\w*\s*\./m, 'module user_code.');
  var runtime = null;
  try { runtime = M.FS.readFile('/aspic_runtime.pi', {encoding: 'utf8'}); }
  catch (e) {}
  setState('compiled the ASP program — running…');
  freshInterpreter(function () {
    if (runtime) M.FS.writeFile('/aspic_runtime.pi', runtime);
    var r2 = doRun(fin);
    r2.ms = Math.round(performance.now() - t0);
    finishRun(r2);
  });
}

/* Drain emscripten's tty output buffer (the layer between fd 1 and
   our print callback).  Characters accumulate there until a '\n' or
   a process exit drain them, and under NO_EXIT_RUNTIME a page never
   exits -- so a program whose output has no trailing newline (most
   planner_* examples) would otherwise lose its last line.  Call after
   every browser_boot / browser_rerun. */
function flushRunOutput() {
  var st;
  try {
    if ((st = M.FS.getStream(1)) && st.tty) st.tty.ops.fsync(st.tty);
    if ((st = M.FS.getStream(2)) && st.tty) st.tty.ops.fsync(st.tty);
  } catch (e) { /* best effort only */ }
}

function doRun(code) {
  var t0 = performance.now();
  M.FS.writeFile('/user_code.pi', code);
  var rc = -1, failed = false;
  try {
        if (!booted) {
      M.ccall('browser_boot', 'null', ['string'], ['/lib2']);
      flushRunOutput();
      booted = true;
    }
    rc = M.ccall('browser_rerun', 'number');
    flushRunOutput();
  } catch (e) {
    /* picat calls exit(1) on uncaught errors; with NO_EXIT_RUNTIME the
       runtime survives.  The run is failed; the next Run takes a
       fresh interpreter anyway (startRun), so a dead instance never
       lingers. */
    failed = true;
  }
  /* the lint runs after every run (like the native path's main()
     tail): it dumps the captured stderr (the run's error messages,
     which the capture holds back from the terminal until here) and
     prints the *** lint: line N: ... diagnostics, then re-arms
     itself for the next run */
  try {
    M.ccall('browser_lint', 'null');
    flushRunOutput();
  } catch (e2) { /* best effort: a lint failure must not kill the run */ }
  return { rc: rc, failed: failed, ms: Math.round(performance.now() - t0) };
}

function finishRun(res) {
  /* the two-stage ASP path runs GENERATED stage files through
     /user_code.pi, so its lint line numbers refer to files the editor
     never shows -- the marker display is suppressed for these runs
     (the terminal output stays: the browser_lint stderr dump is how
     the run's error messages reach the terminal) */
  if (aspRun) clearLint(); else renderLintMarks();
  aspRun = false;
  appendOut('\n[finished in ' + res.ms + ' ms, status ' + res.rc + ']');
  lastrun.textContent = 'last run: ' + res.ms + ' ms';
  var ok = res.rc === 1 && !res.failed;
  setState(ok ? 'idle — last run ok' : 'idle — last run failed',
           ok ? 'ok' : 'err');
  running = false;
  $('run').disabled = false;
  $('run').innerHTML = '&#9654; Run';
}

/* ---- syntax coloring: a small Picat tokenizer, rendered by the #hl
   overlay under the (transparent-text) textarea.  Classes: c comments,
   s strings/quoted atoms, n numbers, v variables, k keywords,
   x constraint operators, a rule arrows/:-/$.  The overlay is scrolled
   only via JS sync (see the editor's scroll listener) and never
   interactive. */
var hl = $('hl');

function hlEsc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* token order matters: comments, strings and quoted atoms must be
   consumed before the scanner can reach a % or a quote inside them;
   0'c character literals are consumed as numbers before a quote can
   start an atom; lowercase identifiers are consumed whole (as plain
   text) so an underscore inside them is not mistaken for the start of
   a variable (all_different must not color as all + _different); the
   asp KEYWORD (the embedded-ASP block opener) is a bare `asp` as the
   final word of a line -- the same marker rule as aspic_prep.pi -- so
   an asp(...) predicate call stays plain */
var HL_RE = /(\/\*[\s\S]*?(?:\*\/|$))|(%[^\n]*)|("(?:\\.|[^"\\\n])*"?)|('(?:\\.|[^'\\\n])*'?)|(0'[^\s]|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|(\b(?:if|then|else|elseif|end|foreach|while|do|in|once|cond)\b)|(\basp\b[ \t\r]*(?=\n|$))|([A-Z_][A-Za-z0-9_]*)|(#[=<>\\!*~]+)|(\?=>|=>|-->|:-|->|::|\$)|([a-z][A-Za-z0-9_]*)/g;

function highlightSrc(src) {
  var out = '', last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(src)) !== null) {
    out += hlEsc(src.slice(last, m.index));
    var cls = m[1] || m[2] ? 'c' : m[3] || m[4] ? 's' : m[5] ? 'n' :
              m[6] || m[7] ? 'k' : m[8] ? 'v' : m[9] ? 'x' : m[10] ? 'a' : '';
    if (cls) out += '<span class="' + cls + '">' + hlEsc(m[0]) + '</span>';
    else out += hlEsc(m[0]);   /* plain identifiers: the base color */
    last = m.index + m[0].length;
  }
  out += hlEsc(src.slice(last));
  return out + '\n';   /* a trailing newline: the last line must scroll */
}

function renderHl() {
  hl.innerHTML = highlightSrc(editor.value);
}

/* ---- lint gutter: flag the rows the *** lint: diagnostics point at --
   The editor is a plain textarea and cannot be marked up in place, so
   a thin strip overlays its right edge and draws one red dot per line
   a *** lint: line N: ... diagnostic mentions (the source-level lint
   in emu/err_hook.c runs after every Run via browser_lint()).  A dot
   is scroll-synced with the textarea, hovering it shows the message,
   and clicking it moves the caret to the flagged line.  The dots
   clear on an edit and are re-rendered after every run. */
var lintgutter = $('lintgutter'), lintmarks = $('lintmarks'), lintrows = $('lintrows'),
    linttip = $('linttip'), editorWrap = document.querySelector('.editor-wrap');

/* the lint tooltip: show a dot's message near the dot (left of the
   gutter, vertically centered on the row); positioned relative to
   .editor-wrap, hidden again on mouseleave and on scroll */
function showLintTip(dot) {
  linttip.textContent = dot.dataset.msg;
  linttip.hidden = false;
  var dr = dot.getBoundingClientRect(), wr = editorWrap.getBoundingClientRect();
  var left = dr.left - wr.left - linttip.offsetWidth - 8;
  var top = dr.top - wr.top + dr.height / 2 - linttip.offsetHeight / 2;
  if (left < 4) left = 4;
  if (top < 4) top = 4;
  linttip.style.left = left + 'px';
  linttip.style.top = top + 'px';
}

function hideLintTip() {
  linttip.hidden = true;
}

/* clear every lint artifact: the gutter dots, the row highlights, and
   a possibly-shown tooltip.  Called when the editor content is
   replaced (loading an example, opening a file, share links --
   programmatic .value assignment fires no input event) and on input. */
function clearLint() {
  while (lintmarks.firstChild) lintmarks.removeChild(lintmarks.firstChild);
  lintgutter.hidden = true;
  while (lintrows.firstChild) lintrows.removeChild(lintrows.firstChild);
  hideLintTip();
}

/* find the text node/offset in #hl for a char offset: the text content
   of #hl is exactly the editor's source plus a trailing newline, so
   char offsets map 1:1 onto it */
function hlTextPos(offset) {
  var walker = document.createTreeWalker(hl, NodeFilter.SHOW_TEXT),
      n, len = 0;
  while ((n = walker.nextNode())) {
    if (len + n.textContent.length >= offset) {
      return { node: n, offset: offset - len };
    }
    len += n.textContent.length;
  }
  return null;
}

/* paint full-width translucent strips behind the flagged lines, one
   per VISUAL row (measured from the rendered #hl rows, so a wrapped
   logical line is fully covered).  The strip positions are computed
   in the content coordinate space and the layer is scroll-synced like
   the gutter dots. */
function renderLintRows(lines) {
  while (lintrows.firstChild) lintrows.removeChild(lintrows.firstChild);
  if (!lines.length) return;
  var hlTop = hl.getBoundingClientRect().top + hl.scrollTop;
  var pad = parseFloat(getComputedStyle(hl).paddingTop) || 0;
  var lh = editorLineHeight();
  lines.forEach(function (n) {
    var from = hlTextPos(offsetOfLine(n)), to = hlTextPos(offsetOfLine(n + 1)),
        r = document.createRange(), rects, saw = {}, any = false, i;
    if (from && to) {
      try {
        r.setStart(from.node, from.offset);
        r.setEnd(to.node, to.offset);
        rects = r.getClientRects();
        for (i = 0; i < rects.length; i++) {
          var top = Math.round(rects[i].top - hlTop);
          if (rects[i].height < 1 || saw[top]) continue;
          saw[top] = 1;
          var b = document.createElement('div');
          b.className = 'row';
          b.style.top = top + 'px';
          b.style.height = Math.ceil(rects[i].height) + 'px';
          lintrows.appendChild(b);
          any = true;
        }
      } catch (e) { /* fall through to the single-row fallback */ }
    }
    if (!any) {   /* e.g. an empty flagged line: one strip, first row */
      var b2 = document.createElement('div');
      b2.className = 'row';
      b2.style.top = (pad + (n - 1) * lh) + 'px';
      b2.style.height = lh + 'px';
      lintrows.appendChild(b2);
    }
  });
  lintrows.style.transform = 'translateY(' + (-editor.scrollTop) + 'px)';
}

function editorLineHeight() {
  var lh = parseFloat(getComputedStyle(editor).lineHeight);
  return (lh > 0) ? lh : 21;
}

function offsetOfLine(n) {
  var lines = editor.value.split('\n'), off = 0, i;
  for (i = 0; i < n - 1 && i < lines.length; i++) off += lines[i].length + 1;
  return off;
}

function jumpToLine(n) {
  editor.focus();
  var off = offsetOfLine(n);
  editor.setSelectionRange(off, off);
  editor.scrollTop = Math.max(0, (n - 1) * editorLineHeight() -
                              editor.clientHeight / 2);
}

function placeLintMarks() {
  var lh = editorLineHeight();
  var pad = parseFloat(getComputedStyle(editor).paddingTop) || 0;
  var marks = lintmarks.children, i;
  for (i = 0; i < marks.length; i++) {
    var n = parseInt(marks[i].dataset.line, 10);
    /* the dot's hit box is 20px (a 14px dot + a transparent 3px border
       on each side); its visible dot stays centered on the text row */
    marks[i].style.top = (pad + (n - 1) * lh + (lh - 20) / 2) + 'px';
  }
  lintmarks.style.transform = 'translateY(' + (-editor.scrollTop) + 'px)';
}

function renderLintMarks() {
  /* the terminal holds this run's output (run() resets it): pick the
     *** lint: lines out of it.  A diagnostic may mention several line
     numbers (e.g. "not contiguous (previous group ended at line 8)")
     -- the first one is always the flagged line. */
  while (lintmarks.firstChild) lintmarks.removeChild(lintmarks.firstChild);
  var seen = {}, flagged = [], lines = terminal.textContent.split('\n'), i;
  for (i = 0; i < lines.length; i++) {
    var m = lines[i].match(/^\*\*\* lint:.*?\bline (\d+)/);
    if (!m) continue;
    var n = parseInt(m[1], 10);
    if (n < 1 || seen[n]) continue;
    seen[n] = 1;
    flagged.push(n);
    var b = document.createElement('div');
    b.className = 'mark';
    b.dataset.line = n;
    b.dataset.msg = lines[i].replace(/^\*\*\* lint:\s*/, '');
    b.addEventListener('mouseenter', function (ev) { showLintTip(ev.target); });
    b.addEventListener('mouseleave', hideLintTip);
    b.addEventListener('click', function (ev) {
      jumpToLine(parseInt(ev.target.dataset.line, 10));
    });
    lintmarks.appendChild(b);
  }
  lintgutter.hidden = (lintmarks.children.length === 0);
  placeLintMarks();
  renderLintRows(flagged);
}

editor.addEventListener('scroll', function () {
  hl.scrollTop = editor.scrollTop;
  hl.scrollLeft = editor.scrollLeft;
  lintmarks.style.transform = 'translateY(' + (-editor.scrollTop) + 'px)';
  lintrows.style.transform = 'translateY(' + (-editor.scrollTop) + 'px)';
  hideLintTip();   /* a stale tooltip would point at the wrong row */
});
editor.addEventListener('input', function () {
  renderHl();
  clearLint();
});

function run() {
  if (!M || running) return;
  running = true;
  $('run').disabled = true;
  $('run').innerHTML = '&#9654; Running&hellip;';
  setState('running…');
  terminal.textContent = '';
  /* picat requires the module name to match the file name, and the file
     is always /user_code.pi: retarget an existing module line.  A
     module line is NOT added when absent -- programs may omit it, and
     for some libraries (e.g. the planner's plan/plan_unbounded, which
     look up final//action/ in the global module) a module line would
     break the program */
  var code = editor.value.replace(
    /^\s*module\s+[A-Za-z_]\w*\s*\./m, 'module user_code.');
  /* doRun runs synchronously in wasm and blocks the main thread for
     the whole program: the browser cannot repaint while it is
     running, so an immediately-started run would grey the button and
     say "running…" in the status bar only in the instant of its end.
     Deferring to after the next painted frame (double rAF) makes the
     running state actually visible for the duration of the run. */
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      setTimeout(function () { startRun(code); }, 0);
    });
  });
}

function startRun(code) {
  /* Every Run takes a fresh interpreter: a live instance keeps its
     compiled modules, and $bp_first_call re-runs an existing module
     user_code in place of a newly loaded module-less program (so
     "hello, then the planner" would run hello again).  A fresh
     instance also re-creates the emulated FS from the preload image
     and starts with a clean VM, so a Run behaves exactly like a
     native `picat file` call. */
  freshInterpreter(function () { startRunFresh(code); });
}

function startRunFresh(code) {
  try {
    if (hasAspBlock(code)) {
      runAspStages(code);   // reports itself
      return;
    }
    finishRun(doRun(code));
  } catch (e) {
    /* e.g. a failed FS write: never leave the button stuck disabled */
    appendOut('\ninternal error: ' + e);
    finishRun({ rc: -1, failed: true, ms: 0 });
  }
}
$('run').addEventListener('click', run);

/* ---- file menu ------------------------------------------------------- */
var menu = $('filemenu');
$('filemenu-btn').addEventListener('click', function (e) {
  e.stopPropagation();
  menu.classList.toggle('open');
});
document.addEventListener('click', function () {
  menu.classList.remove('open');
});
$('save-file').addEventListener('click', function () {
  var blob = new Blob([editor.value], {type: 'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = srcName();
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
});
$('open-file').addEventListener('click', function () {
  $('file-input').click();
});
$('file-input').addEventListener('change', function () {
  var f = this.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    editor.value = r.result;
    clearLint();  /* the content was replaced: drop the old lint artifacts */
    renderHl();  /* no input event */
    setSrcName();
  };
  r.readAsText(f);
  this.value = '';
});

/* ---- share link: the whole program in one URL parameter -------------- */
/* ?program= carries the editor text base64url-encoded (utf-8).  The link
   points at this page itself (origin + path of wherever this build is
   served), so visiting it restores the program into the editor. */
function b64encode(s) {
  var bytes = new TextEncoder().encode(s);
  var bin = '';
  for (var i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64decode(v) {
  v = v.replace(/-/g, '+').replace(/_/g, '/');
  while (v.length % 4) v += '=';
  var bin = atob(v);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
$('share-link').addEventListener('click', function () {
  var url = location.origin + location.pathname +
            '?program=' + b64encode(editor.value);
  var fallback = function () { window.prompt('Copy this share link:', url); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function () {
      setState('share link copied to the clipboard');
    }, fallback);
  } else {
    fallback();
  }
});
function applySharedLink() {
  var p = new URLSearchParams(location.search).get('program');
  if (!p) return;
  try {
    editor.value = b64decode(p);
    clearLint();  /* the content was replaced: drop the old lint artifacts */
    renderHl();  /* no input event */
    setSrcName();
    setState('program loaded from share link');
  } catch (e) {
    setState('the share link does not contain a valid program', 'err');
  }
}

/* ---- load-from-link dialog ---------------------------------------------- */
/* A share link can be too long for some servers to accept as a request;
   this path decodes one locally, so only an ordinary page load reaches
   the server.  The field takes the full link (its program parameter is
   extracted) or, for convenience, the bare encoded program text. */
var linkdlg = $('linkdlg');
function closeLinkDlg() { linkdlg.hidden = true; }
$('load-link').addEventListener('click', function () {
  $('linkurl').value = '';
  linkdlg.hidden = false;
  $('linkurl').select();
});
$('linkcancel').addEventListener('click', closeLinkDlg);
linkdlg.addEventListener('click', function (e) {
  if (e.target === linkdlg) closeLinkDlg();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !linkdlg.hidden) closeLinkDlg();
});
$('linkok').addEventListener('click', loadFromLinkText);
$('linkurl').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') loadFromLinkText();
});
function loadFromLinkText() {
  var v = $('linkurl').value.trim();
  if (!v) { closeLinkDlg(); return; }
  var p = v, isUrl = false;
  if (v.indexOf('://') >= 0 || v.charAt(0) === '/') {
    isUrl = true;
    var q = new URL(v, location.href).searchParams.get('program');
    if (!q) { setState('that link has no program parameter', 'err'); return; }
    p = q;
  }
  try {
    editor.value = b64decode(p);
    clearLint();  /* the content was replaced: drop the old lint artifacts */
    renderHl();  /* no input event */
    setSrcName();
    closeLinkDlg();
    setState('program loaded from link');
  } catch (e) {
    setState(isUrl ? 'the link does not contain a valid program'
                   : 'that text is not a valid encoded program', 'err');
  }
}

/* ---- module lifecycle -------------------------------------------------- */
/* Create an interpreter module.  This is the unit a "restart" re-creates:
   a fresh module is a fresh initialize_bprolog with a fresh emulated
   filesystem (all example data files are baked into the preload image). */
function createModule() {
  return PicatWasm({
    print:  function (s) { appendOut(s); },
    printErr: function (s) { appendOut(s); },
  }).then(function (mod) {
    M = mod;
    booted = false;
    return mod;
  });
}

function populateExamples() {
  var files = M.FS.readdir('/examples')
                 .filter(function (f) { return /\.pi$/.test(f); })
                 .sort();
  var sel = $('examples');
  sel.innerHTML = '';
  files.forEach(function (f) {
    var o = document.createElement('option');
    o.value = f;
    o.textContent = f;
    sel.appendChild(o);
  });
  if (files.length) {
    sel.value = files[0];
    loadExample();
  }
}

/* ---- boot -------------------------------------------------------------- */
createModule().then(function () {
  populateExamples();
  applySharedLink();         // a ?program= link overrides the default example
  $('run').disabled = false;
  setState('ready');
  setSrcName();
}).catch(function (e) {
  setState('failed to load the runtime: ' + e.message, 'err');
});

</script>
</body>
</html>
